<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go + Gemini AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts for sleek typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-info">
        <div class="status-indicator"></div>
        <div>
          <h2>Go Gemini Assistant</h2>
          <span class="subtitle">Fast, Lightweight Go Backend</span>
        </div>
      </div>
      <button id="clear-btn" title="Clear conversation">Clear</button>
    </header>

    <!-- Message List -->
    <main id="chat-messages" class="chat-messages">
      <div class="message bot-message">
        <div class="avatar">🤖</div>
        <div class="bubble">
          Hello! I am your AI assistant powered by <strong>Go</strong> and <strong>Google Gemini</strong>. How can I help you today?
        </div>
      </div>
    </main>

    <!-- Typing Indicator -->
    <div id="typing-indicator" class="typing-indicator hidden">
      <div class="avatar">🤖</div>
      <div class="bubble typing-bubble">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Input Form -->
    <form id="chat-form" class="chat-input-area">
      <input
        type="text"
        id="user-input"
        placeholder="Type a message... (Press Enter to send)"
        autocomplete="off"
        required
      />
      <button type="submit" id="send-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
